# Cloudflare Pages: the static site in dist/ (npm run deploy) and functions/up/, which keeps the site's own data in
# the R2 bucket below. The function's UPLOAD_KEY is a Pages secret (npx wrangler pages secret put UPLOAD_KEY).
name = "nextmap"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"

[[r2_buckets]]
binding = "TILES"
bucket_name = "nextmap-data"
